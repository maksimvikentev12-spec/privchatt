name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build APK
      run: |
        echo "y" | sdkmanager --licenses > /dev/null 2>&1 || true
        mkdir -p app/src/main/java/com/nuza/app
        
        # Создаем манифест
        echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.nuza.app"><uses-permission android:name="android.permission.INTERNET" /><application android:allowBackup="true" android:icon="@android:drawable/sym_def_app_icon" android:label="NuzaGram" android:theme="@android:style/Theme.NoTitleBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter></activity></application></manifest>' > app/src/main/AndroidManifest.xml
        
        # Создаем MainActivity.java
        echo 'package com.nuza.app; import android.app.Activity; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebViewClient; public class MainActivity extends Activity { @Override protected void onCreate(Bundle savedInstanceState) { super.onCreate(savedInstanceState); WebView webView = new WebView(this); webView.getSettings().setJavaScriptEnabled(true); webView.getSettings().setDomStorageEnabled(true); webView.setWebViewClient(new WebViewClient()); webView.loadUrl("https://nuzagram.onrender.com"); setContentView(webView); } }' > app/src/main/java/com/nuza/app/MainActivity.java
        
        # Создаем конфигурационные файлы
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "include ':app'" > settings.gradle
        echo "android.useAndroidX=true" > gradle.properties
        
        # ГЛАВНЫЙ ФАЙЛ build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF
        
        # ФАЙЛ app/build.gradle (тут была ошибка, теперь всё правильно)
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        android {
            namespace 'com.nuza.app'
            compileSdkVersion 33
            defaultConfig {
                applicationId "com.nuza.app"
                minSdkVersion 24
                targetSdkVersion 33
                versionCode 1
                versionName "1.0"
            }
            buildTypes { release { minifyEnabled false } }
        }
        EOF
        
        gradle wrapper --gradle-version 7.5
        ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: NuzaGram-APK
        path: app/build/outputs/apk/debug/app-debug.apk
